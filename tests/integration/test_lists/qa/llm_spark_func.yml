version: 0.0.1
llm_spark_func:
# ===============================================================================
# 1: Single GPU Spark func cases
# ===============================================================================
- condition:
    ranges:
      system_gpu_count:
        gte: 1
        lte: 1
  tests:
  - test_e2e.py::test_ptp_quickstart_advanced[GPT-OSS-20B-gpt_oss/gpt-oss-20b]
  - test_e2e.py::test_ptp_quickstart_advanced[GPT-OSS-120B-gpt_oss/gpt-oss-120b]
  - test_e2e.py::test_ptp_quickstart_advanced[Qwen3-8b-fp8-Qwen3/nvidia-Qwen3-8B-FP8]
  - test_e2e.py::test_ptp_quickstart_advanced[Qwen3-8b-nvfp4-Qwen3/nvidia-Qwen3-8B-NVFP4]
  - test_e2e.py::test_ptp_quickstart_advanced[Qwen3-8B-bf16-Qwen3/Qwen3-8B]
  - accuracy/test_llm_api_pytorch.py::TestGPTOSS::test_eagle3_1gpu[cutlass-one_model]
  - test_e2e.py::test_ptp_quickstart_advanced[Qwen3-14b-fp8-Qwen3/nvidia-Qwen3-14B-FP8]
  - test_e2e.py::test_ptp_quickstart_advanced[Qwen3-14b-nvfp4-Qwen3/nvidia-Qwen3-14B-NVFP4]
  - test_e2e.py::test_ptp_quickstart_advanced[Qwen3-14B-bf16-Qwen3/Qwen3-14B]
  - test_e2e.py::test_ptp_quickstart_advanced[Qwen3-32B-bf16-Qwen3/Qwen3-32B]
  - test_e2e.py::test_ptp_quickstart_advanced[Qwen3-32b-nvfp4-Qwen3/nvidia-Qwen3-32B-NVFP4]
  - test_e2e.py::test_ptp_quickstart_advanced[Qwen3-30B-A3B-Qwen3/Qwen3-30B-A3B]
  - test_e2e.py::test_ptp_quickstart_advanced[Qwen3-30B-A3B_nvfp4_hf-Qwen3/saved_models_Qwen3-30B-A3B_nvfp4_hf]
  - test_e2e.py::test_ptp_quickstart_advanced[Nemotron-Nano-9B-v2-nvfp4-NVIDIA-Nemotron-Nano-9B-v2-NVFP4]
  - test_e2e.py::test_ptp_quickstart_advanced_eagle3[GPT-OSS-120B-Eagle3-gpt_oss/gpt-oss-120b-gpt_oss/gpt-oss-120b-Eagle3]
  - test_e2e.py::test_ptp_quickstart_advanced[Qwen3.6-35B-A3B-nvfp4-Qwen3.6-35B-A3B-NVFP4]
  - accuracy/test_llm_api_pytorch_multimodal.py::TestGemma4_26B_A4B::test_nvfp4_no_mtp
  - accuracy/test_llm_api_pytorch_multimodal.py::TestGemma4_26B_A4B::test_nvfp4
  - accuracy/test_llm_api_pytorch.py::TestQwen3_30B_A3B::test_nvfp4[latency_moe_cutlass-torch_compile=False]
  - test_e2e.py::test_trtllm_benchmark_serving[gpt_oss/gpt-oss-20b]
  - examples/serve/test_serve.py::test_nemotron3_super_120b_nvfp4
  - accuracy/test_llm_api_pytorch.py::TestNemotron35Lightning::test_nvfp4_cutedsl_mtp3_chunked_prefill
  - examples/serve/test_serve.py::test_nemotron35_lightning_30b[nvfp4]
  - examples/serve/test_serve.py::test_nemotron35_lightning_30b[bf16]
  - examples/serve/test_serve.py::test_nemotron3_nano_omni_nvfp4[text_reasoning_on]
  - examples/serve/test_serve.py::test_nemotron3_nano_omni_nvfp4[tool_calling]
  - examples/serve/test_serve.py::test_nemotron3_nano_omni_nvfp4[image]
  - examples/serve/test_serve.py::test_nemotron3_nano_omni_nvfp4[video]
  # Agentic features: structured output and shared-prefix scheduling.
  - test_e2e.py::test_openai_chat_guided_decoding[openai/gpt-oss-120b]
  - kv_cache/test_prefix_aware_scheduling.py::TestServePrefixAwareScheduling::test_multi_round_qa_shared_prefix_smoke
  # Accuracy, one case per SM121 code path: MLA + BF16 MoE, MLA + NVFP4 MoE, MXFP4 MoE (gpt-oss),
  # per-tensor FP8 MoE + Mamba (Nemotron Nano V3).
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV3Lite::test_bfloat16[mtp_nextn=0-attention_dp=False-cuda_graph=False-overlap_scheduler=False-torch_compile=False-enable_chunked_prefill=False-v2_kv_cache=True]
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV3Lite::test_bfloat16[mtp_nextn=0-attention_dp=False-cuda_graph=True-overlap_scheduler=True-torch_compile=True-enable_chunked_prefill=False-v2_kv_cache=True]
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV3Lite::test_nvfp4[moe_backend=CUTLASS-mtp_nextn=0-fp8kv=False-attention_dp=False-cuda_graph=False-overlap_scheduler=False-torch_compile=False]
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV3Lite::test_nvfp4[moe_backend=CUTLASS-mtp_nextn=0-fp8kv=True-attention_dp=False-cuda_graph=True-overlap_scheduler=True-torch_compile=True]
  - accuracy/test_llm_api_pytorch.py::TestGPTOSS::test_w4_1gpu[v2_kv_cache-True-True-cutlass-auto]
  - accuracy/test_llm_api_pytorch.py::TestNemotronV3Nano::test_fp8
  # Expected to fail on SM121 until MLA chunked prefill accepts SM121
  # (_MLA_CHUNKED_PREFILL_SUPPORTED_SM_VERSIONS lists 120 but not 121).
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV3Lite::test_chunked_prefill[quant_dtype=none-kv_cache_reuse=False-fp8kv=False-overlap_scheduler=True]
  # Expected to fail on SM121 until FP8 block-scale linear, MoE and MLA BMM accept SM121
  # (Python checks sm == 120 while C++ getSMVersion() maps 121 to 120).
  - accuracy/test_llm_api_pytorch.py::TestQwen3_8B::test_fp8_block_scales[latency]
  - accuracy/test_llm_api_pytorch.py::TestDeepSeekV3Lite::test_fp8_block_scales[mtp=disable-fp8kv=False-attention_dp=False-cuda_graph=False-overlap_scheduler=False-torch_compile=False]
# ===============================================================================
# 2: Multi-GPU (2 GPUs) Spark func cases with multinode support
# ===============================================================================
- condition:
    ranges:
      system_gpu_count:
        gte: 2
        lte: 2
  tests:
  - test_e2e.py::test_ptp_quickstart_advanced_multinode[Qwen3/saved_models_Qwen3-235B-A22B_nvfp4_hf-tp2]
  - accuracy/test_llm_api_pytorch.py::TestQwen3_235B_A22B::test_nvfp4_2gpus[latency_moe_cutlass]
  - accuracy/test_llm_api_pytorch.py::TestQwen3_235B_A22B::test_nvfp4_2gpus[latency_moe_cutlass_eagle3]
  - accuracy/test_llm_api_pytorch.py::TestQwen3_235B_A22B::test_nvfp4_2gpus[latency_moe_cutlass_pp2]
  # Expected to fail until MoE all-to-all auto-selection falls back when NcclEP
  # cannot initialize (no NCCL Device API between Spark nodes).
  - accuracy/test_llm_api_pytorch.py::TestQwen3_235B_A22B::test_nvfp4_2gpus[latency_moe_cutlass_attention_dp]
  # Qwen3-30B-A3B has the Qwen3-235B MoE architecture and fits 2x 64GB nodes;
  # cuda_graph_overlap covers the TP2 hang with CUDA graph plus overlap scheduler.
  - accuracy/test_llm_api_pytorch.py::TestQwen3_30B_A3B::test_nvfp4_2gpus[latency_moe_cutlass]
  - accuracy/test_llm_api_pytorch.py::TestQwen3_30B_A3B::test_nvfp4_2gpus[latency_moe_cutlass_cuda_graph_overlap]
  - test_e2e.py::test_ptp_quickstart_advanced_multinode[Qwen3.6-27B-tp2]
  - test_e2e.py::test_ptp_quickstart_advanced_multinode[Qwen3.6-27B-pp2]
  - test_e2e.py::test_ptp_quickstart_advanced_multinode[NVIDIA-Nemotron-3-Super-120B-A12B-FP8-tp2]
  - accuracy/test_llm_api_pytorch.py::TestQwen3_5_35B_A3B::test_bf16[tp2-CUTLASS]
