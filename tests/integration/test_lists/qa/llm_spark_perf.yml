version: 0.0.1
llm_spark_perf:
# ===============================================================================
# 1: Single GPU Spark perf cases
# ===============================================================================
- condition:
    ranges:
      system_gpu_count:
        gte: 1
        lte: 1
  tests:
  - perf/test_perf.py::test_perf[gpt_oss_20b_fp4-bench-pytorch-streaming-float4-maxbs:1-input_output_len:2048,128-reqs:1-con:1]
  - perf/test_perf.py::test_perf[gpt_oss_120b_fp4-bench-pytorch-streaming-float4-maxbs:1-input_output_len:2048,128-reqs:1-con:1]
  - perf/test_perf.py::test_perf[nemotron_3_nano_omni_nvfp4-serve-pytorch-streaming-float4-maxbs:1-input_output_len:2048,1024-reqs:1-con:1]
  - perf/test_perf.py::test_perf[nemotron_3_nano_omni_nvfp4_image-serve-pytorch-streaming-float4-maxbs:1-input_output_len:2048,1024-reqs:1-con:1]
  - perf/test_perf.py::test_perf[nemotron_3_nano_30b_fp4-bench-pytorch-streaming-float4-maxbs:4-maxnt:8192-input_output_len:8192,512-reqs:16-con:4]
  - perf/test_perf.py::test_perf[nemotron_3_nano_30b-bench-pytorch-streaming-bfloat16-maxbs:8-maxnt:8192-input_output_len:16384,128-reqs:32-con:8]
  - perf/test_perf.py::test_perf[qwen3.8_27b_fp4-bench-pytorch-streaming-float4-maxbs:1-input_output_len:2048,128-reqs:1-con:1]
  - perf/test_perf.py::test_perf[qwen3.8_27b_fp4-bench-pytorch-streaming-float4-maxbs:1-maxnt:8192-input_output_len:8192,256-reqs:1-con:1]
  - perf/test_perf.py::test_perf[nemotron_3.5_lightning_30b_bf16_mtp-serve-pytorch-streaming-bfloat16-maxbs:1-maxnt:8192-input_output_len:2048,256-kv_cache_dtype:fp8-reqs:1-con:1]
  - perf/test_perf.py::test_perf[llama_v3.1_8b_instruct_fp8-bench-pytorch-streaming-float8-maxbs:1-input_output_len:2048,128-reqs:1-con:1]
  - perf/test_perf.py::test_perf[llama_v3.1_8b_instruct_fp4-bench-pytorch-streaming-float4-maxbs:1-input_output_len:2048,128-reqs:1-con:1]
  - perf/test_perf.py::test_perf[llama_v3.1_8b_instruct-bench-pytorch-streaming-bfloat16-maxbs:1-input_output_len:2048,128-reqs:1-con:1]
  - perf/test_perf.py::test_perf[gemma_4_26b_a4b_nvfp4-bench-pytorch-streaming-float4-maxbs:4-maxnt:8192-input_output_len:8192,512-reqs:16-con:4]
  # Agentic context, decode at large cached input: one agent, one model per attention type
  # (gpt-oss sliding window + sinks, Qwen3.6 linear attention, Gemma 4 VSWA, Nemotron-H Mamba).
  - perf/test_perf.py::test_perf[gpt_oss_120b_fp4-bench-pytorch-streaming-float4-maxbs:4-maxnt:8192-input_output_len:32768,512-reqs:8-con:4]
  - perf/test_perf.py::test_perf[nemotron_3_super_120b_nvfp4_mtp-serve-pytorch-streaming-float4-maxbs:8-maxnt:4096-input_output_len:32768,512-kv_cache_dtype:fp8-reqs:4-con:1]
  # Tool-call style: 16K input, 128 output, eight agents.
  - perf/test_perf.py::test_perf[gpt_oss_120b_fp4-serve-pytorch-streaming-float4-maxbs:4-maxnt:8192-input_output_len:4096,512-reqs:16-con:4-prefix:28672-cfg:reuse]
  - perf/test_perf.py::test_perf[gpt_oss_120b_fp4-serve-pytorch-streaming-float4-maxbs:4-maxnt:8192-input_output_len:4096,512-reqs:16-con:4-prefix:28672-cfg:noreuse]
  - perf/test_perf.py::test_perf[nemotron_3_super_120b_nvfp4-serve-pytorch-streaming-float4-maxbs:8-maxnt:4096-input_output_len:4096,512-reqs:16-con:4-prefix:28672-cfg:reuse]
  # Speculative decoding on real text (cnn_dailymail), so draft tokens can be accepted. Compare TPOT with the
  # bench cases of the base checkpoint at the same input/output length.
  - perf/test_perf.py::test_perf[gpt_oss_120b_eagle3-serve-pytorch-streaming-float4-maxbs:1-input_output_len:128,2048-reqs:4-con:1]
# ===============================================================================
# 2: Multi-GPU (2 GPUs) Spark perf cases with multinode support
# ===============================================================================
- condition:
    ranges:
      system_gpu_count:
        gte: 2
        lte: 2
  tests:
  - perf/test_perf.py::test_perf[qwen3_235b_a22b_fp4-bench-pytorch-streaming-float4-maxbs:1-input_output_len:2048,128-kv_cache_dtype:fp8-reqs:1-con:1-tp:2-gpus:2]
  - perf/test_perf.py::test_perf[qwen3_235b_a22b_fp4_eagle3-bench-pytorch-streaming-float4-maxbs:1-input_output_len:2048,128-kv_cache_dtype:fp8-reqs:1-con:1-tp:2-gpus:2]
  - perf/test_perf.py::test_perf[qwen3.8_27b_fp4-bench-pytorch-streaming-float4-maxbs:1-input_output_len:2048,128-reqs:1-con:1-tp:2-gpus:2]
  - perf/test_perf.py::test_perf[qwen3.8_27b_fp4-bench-pytorch-streaming-float4-maxbs:1-maxnt:8192-input_output_len:8192,256-reqs:1-con:1-tp:2-gpus:2]
  - perf/test_perf.py::test_perf[qwen3.8_flash_next_fp4-bench-pytorch-streaming-float4-maxbs:1-input_output_len:2048,128-reqs:1-con:1-ep:2-tp:2-gpus:2]
  - perf/test_perf.py::test_perf[nemotron_3_super_120b_fp8-bench-pytorch-streaming-float8-maxbs:1-input_output_len:2048,128-reqs:1-con:1-ep:2-tp:2-gpus:2]
